<!DOCTYPE html>
<html>
<head>
    <link href="style.css" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.2.1/themes/default/style.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <link type="text/css" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/golden-layout/1.5.9/css/goldenlayout-base.css" />
    <link type="text/css" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/golden-layout/1.5.9/css/goldenlayout-dark-theme.css" />


    <script>if (typeof module === 'object') {window.module = module; module = undefined;}</script>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>

    <script>if (typeof module === 'object') {window.module = module; module = undefined;}</script>
    <link rel="stylesheet" href="https://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/themes/smoothness/jquery-ui.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"></script>

    <script>if (typeof module === 'object') {window.module = module; module = undefined;}</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.2.1/jstree.min.js"></script>

    <script>if (window.module) module = window.module;</script>

    <script>
        // 브라우저 기본 컨텍스트 메뉴 비활성화
        document.addEventListener('contextmenu', event => event.preventDefault());
    </script>

    <meta charset="utf-8">
    <title>NodeView - Flysher</title>
    <link rel="icon" type="image/GIF" href="res/favicon.ico"/>

    <meta name="viewport"
          content="width=device-width,user-scalable=no,initial-scale=1, minimum-scale=1,maximum-scale=1"/>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">

    <meta name="renderer" content="webkit"/>
    <meta name="force-rendering" content="webkit"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta name="msapplication-tap-highlight" content="no">

    <meta name="full-screen" content="yes"/>
    <meta name="x5-fullscreen" content="true"/>
    <meta name="360-fullscreen" content="true"/>

    <meta name="browsermode" content="application">
    <meta name="x5-page-mode" content="app">

    <script src="../renderer.js"></script>
</head>
<body>
<div id="app-toolbar" role="toolbar" aria-label="도구 모음">
    <div id="panel-toggle-menu-container" class="tb-group">
        <button type="button" id="panel-toggle-button" class="tb-btn" title="패널 열기/닫기"><i class="fas fa-layer-group"></i> 패널 ▾</button>
        <div id="panel-toggle-dropdown"></div>
    </div>
    <button type="button" id="layout-reset-btn" class="tb-btn" title="패널 배치를 기본값으로">레이아웃 초기화</button>

    <span class="tb-spacer"></span>

    <div id="resolution-controller" class="tb-group">
        <span class="tb-label">해상도</span>
        <input type="number" id="res-width-input" class="tb-input" placeholder="자동" aria-label="해상도 너비">
        <span class="tb-label">×</span>
        <input type="number" id="res-height-input" class="tb-input" placeholder="자동" aria-label="해상도 높이">
        <button type="button" id="res-apply-btn" class="tb-btn">적용</button>
        <button type="button" id="res-auto-btn" class="tb-btn" title="Game View 패널 크기에 맞춤">자동</button>
    </div>
    <div id="background-color-controller" class="tb-group">
        <label class="tb-label" for="bg-color-picker">배경</label>
        <input type="color" id="bg-color-picker">
    </div>
    <button type="button" id="toggle-fullscreen-btn" class="tb-btn tb-icon" title="전체화면 전환/해제" aria-label="전체화면 전환/해제"><i class="fas fa-expand"></i></button>
</div>
<div id="resize-overlay"></div>
<div id="panels-container-area">
    <div class="vertical-guide"></div>
    <div class="horizontal-guide"></div>
</div>
<div id="status-bar">
    <span class="sb-item sb-ready"><span class="sb-dot"></span>준비됨</span>
    <span class="sb-item sb-assets"></span>
    <span class="sb-item sb-textures"></span>
    <button type="button" class="sb-item sb-missing" style="display: none;"><i class="fas fa-exclamation-triangle"></i> <span class="sb-missing-text"></span></button>
    <span class="sb-spacer"></span>
    <button type="button" class="sb-item sb-console" title="Console 열기"></button>
    <span class="sb-item sb-fps"></span>
</div>

<div id="original-content-templates">

    <div id="custom-context-menu" class="context-menu" style="display: none;">
        <ul>
            <li data-action="copy-uiwidgets-subtree" class="jstree-only">이 노드 아래만 uiWidgets 복사</li>
            <li data-action="copy-uiwidgets-options" class="jstree-only">uiWidgets 복사 옵션…</li>
            <li data-action="copy-node-name" class="jstree-only">노드 이름 복사</li>
            <li data-action="copy-node-path" class="jstree-only">경로 복사</li>
            <li class="context-menu-separator jstree-only" role="separator"></li>
            <li data-action="delete">삭제</li>
        </ul>
    </div>'

    <div id="fileContainer" class="fileContainer">
        <div class="panel-toolbar assets-toolbar">
            <label class="panel-search">
                <i class="fas fa-search" aria-hidden="true"></i>
                <input type="text" id="assetSearch" placeholder="에셋·리소스 검색" aria-label="에셋·리소스 검색" spellcheck="false">
            </label>
            <div id="assetFilters" class="filter-chips" role="group" aria-label="에셋 종류 필터"></div>
        </div>
        <div id="tab-1" class="tab-fileContent current">
            <div class = "smallWidget">
                <div id="fileNameTree"></div>
            </div>
        </div>
    </div>

    <div id="widgetContainer" class="widgetContainer">
        <div class="panel-toolbar hier-toolbar">
            <label class="panel-search">
                <i class="fas fa-search" aria-hidden="true"></i>
                <input type="text" id="searchNode" class="searchNode" placeholder="노드 이름 검색 (t:Text 로 종류 필터)" aria-label="노드 검색" spellcheck="false">
            </label>
            <button type="button" id="openAll" class="icon-btn" title="모두 펼치기" aria-label="모두 펼치기"><i class="fas fa-angle-double-down" aria-hidden="true"></i></button>
            <button type="button" id="closeAll" class="icon-btn" title="모두 접기" aria-label="모두 접기"><i class="fas fa-angle-double-up" aria-hidden="true"></i></button>
        </div>
        <div id="tab-1" class="tab-widgetContent current">
            <div class = "treeWidget">
                <div id="widgetTree"></div>
                <div id="animationTree"></div>
            </div>
            <div class="hier-footer">
                <div class="uiw-split">
                    <button type="button" id="copyBtn" title="uiWidgets 코드 복사 (Ctrl+Shift+C)"><i class="far fa-copy" aria-hidden="true"></i> uiWidgets 복사</button>
                    <button type="button" id="copyOptionsBtn" title="복사 옵션과 미리보기" aria-label="복사 옵션과 미리보기">▾</button>
                </div>
                <span class="hier-footer-hint">Ctrl+Shift+C</span>
            </div>

            <div id="ui-option">
            </div>

        </div>
    </div>

    <div id="nodeInfoContainer" class="nodeInfoContainer">
        <div class="inspector-top-area">
            <input type="checkbox" id="inspector-visible" aria-label="Visible" disabled>
            <input type="text" id="nodeName" name="nodeName" class="positionInput inspector-name-input" aria-label="노드 이름" disabled>
        </div>
        <div id="inspector-header-extra" class="inspector-chips"></div>
        <div id="inspector-body" class="panel-content-inner"></div>
    </div>

    <div id="sequencerContainer" class="widgetContainer">
      <div class="seq-layout">
        <!-- 왼쪽: 선택한 인스턴스의 애니메이션 목록 (클릭: 미리보기, 드래그: 트랙에 추가) -->
        <div class="seq-anim-list">
            <div class="seq-anim-header">
                <span class="seq-anim-title">애니메이션</span>
                <span id="seqAnimSource" class="seq-anim-source"></span>
            </div>
            <div class="actionWidget">
                <div id="actionTree"></div>
            </div>
            <div class="seq-anim-hint">클릭: 미리보기 · 드래그: 트랙에 추가</div>
        </div>
        <div id="tab-1" class="tab-widgetContent current seq-main">

            <div id="timeline-top-bar">
                <div class="seq-tool-group">
                    <button type="button" id="addSequenceBtn" class="seq-btn" title="선택한 애니메이션을 트랙에 추가" aria-label="선택한 애니메이션을 트랙에 추가">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
                            <path fill-rule="evenodd" d="M12 3.75a.75.75 0 0 1 .75.75v6.75h6.75a.75.75 0 0 1 0 1.5h-6.75v6.75a.75.75 0 0 1-1.5 0v-6.75H4.5a.75.75 0 0 1 0-1.5h6.75V4.5a.75.75 0 0 1 .75-.75Z" clip-rule="evenodd" />
                        </svg>

                    </button>
                    <button type="button" id="playSequenceBtn" class="seq-btn primary" title="시퀀스 재생 / 일시정지" aria-label="시퀀스 재생 / 일시정지">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
                            <path d="M6.3 2.84A1.5 1.5 0 0 0 4 4.11v11.78a1.5 1.5 0 0 0 2.3 1.27l9.344-5.891a1.5 1.5 0 0 0 0-2.538L6.3 2.841Z" />
                        </svg>
                    </button>
                    <button type="button" id="stopSequenceBtn" class="seq-btn" title="시퀀스 정지" aria-label="시퀀스 정지">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
                            <path d="M5.25 3A2.25 2.25 0 0 0 3 5.25v9.5A2.25 2.25 0 0 0 5.25 17h9.5A2.25 2.25 0 0 0 17 14.75v-9.5A2.25 2.25 0 0 0 14.75 3h-9.5Z" />
                        </svg>
                    </button>
                    <button type="button" id="clearSequenceBtn" class="seq-btn" title="시퀀스 초기화 (모든 클립 삭제)" aria-label="시퀀스 초기화">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
                            <path fill-rule="evenodd" d="M16.5 4.478v.227a48.816 48.816 0 0 1 3.878.512.75.75 0 1 1-.256 1.478l-.209-.035-1.005 13.07a3 3 0 0 1-2.991 2.77H8.084a3 3 0 0 1-2.991-2.77L4.087 6.66l-.209.035a.75.75 0 0 1-.256-1.478A48.567 48.567 0 0 1 7.5 4.705v-.227c0-1.564 1.213-2.9 2.816-2.951a52.662 52.662 0 0 1 3.369 0c1.603.051 2.815 1.387 2.815 2.951Zm-6.136-1.452a51.196 51.196 0 0 1 3.273 0C14.39 3.05 15 3.684 15 4.478v.113a49.488 49.488 0 0 0-6 0v-.113c0-.794.609-1.428 1.364-1.452Zm-.355 5.945a.75.75 0 1 0-1.5.058l.347 9a.75.75 0 1 0 1.499-.058l-.346-9Zm5.48.058a.75.75 0 1 0-1.498-.058l-.347 9a.75.75 0 0 0 1.5.058l.345-9Z" clip-rule="evenodd" />
                        </svg>

                    </button>
                </div>
                <span id="seqTimeReadout" class="seq-time">00:00.00 <span class="seq-time-total">/ 00:00.00</span></span>
                <span class="seq-spacer"></span>
                <div class="seq-tool-group">
                    <button type="button" id="zoom-out-btn" class="seq-btn" title="타임라인 축소" aria-label="타임라인 축소">−</button>
                    <button type="button" id="zoom-in-btn" class="seq-btn" title="타임라인 확대" aria-label="타임라인 확대">+</button>
                </div>
            </div>

            <div id="timeline-editor">
                <div id="timeline-header-wrapper">
                    <div id="timeline-header-label"></div>
                    <div id="timeline-header-ruler">
                        <div id="timeline-ruler"></div>
                    </div>
                </div>
                <div id="timeline-body-wrapper">
                    <div id="track-labels-container">
                    </div>
                    <div id="timeline-tracks-container">
                        <div id="timeline-content">
                        </div>

                        <div id="timeline-interaction-overlay"></div>
                    </div>
                </div>
                <div id="timeline-playhead"></div>
            </div>
        </div>
      </div>
    </div>

    <div align="center">
        <button type="button" id="DownloadBtn" class="styleButton" title="Download" style="width: 80%; visibility: hidden;">Download</button>
    </div>
</div>

<div id="game-canvas-template">
    <canvas id="gameCanvas" width="480" height="720"></canvas>
</div>

<script src="res/loading.js"></script>
<script src="frameworks/cocos2d-html5/CCBoot.js"></script>
<script cocos src="main.js"></script>
<script src="src/DownloadCurrent.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/golden-layout/1.5.9/goldenlayout.min.js"></script>

</body>
</html>
